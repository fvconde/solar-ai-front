name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de unidade do front
        run: npm test -- --no-watch --browsers=ChromeHeadless

      - name: Compilar aplicação (build)
        run: npm run build

      - name: Executar testes operacionais stdlib (sem Docker)
        run: python -m unittest discover -s deploy/tests -p test_front.py
